<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2454d6">
  <meta name="robots" content="noindex,nofollow">
  <title>Reconnect to PinoyBuyNSell</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#edf2ff,#fff8dc);font-family:system-ui,-apple-system,sans-serif;color:#242424}main{width:min(100%,480px);padding:32px;border:1px solid #dce4f0;border-radius:24px;background:white;text-align:center;box-shadow:0 16px 50px #14213d12}img{width:100px;height:100px;object-fit:contain}h1{font-size:30px;letter-spacing:-1px}p{line-height:1.65;color:#526075}button,a{display:block;width:100%;padding:14px 20px;border-radius:999px;font:inherit;font-weight:700;cursor:pointer}button{background:#2454d6;color:white;border:0;margin:24px 0 12px}a{color:#2454d6;text-decoration:none;border:1px solid #c7d4f4}small{display:block;margin-top:24px;color:#64748b}
  </style>
</head>
<body>
  <main>
    <img src="/branding/pinoybuynsell-facebook-profile.png" alt="PinoyBuyNSell">
    <h1>Let’s get you connected.</h1>
    <p>You’re offline or the website couldn’t be reached. Reconnect to browse current listings, place a bid, upload photos, or send messages.</p>
    <button id="retry" type="button">Try again</button>
    <a href="/">Back to marketplace</a>
    <small>Bids and messages require a connection. Nothing is queued to submit later.</small>
  </main>
  <script>document.getElementById('retry').addEventListener('click',function(){window.location.reload();});</script>
</body>
</html>
